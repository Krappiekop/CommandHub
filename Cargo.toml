[package]
name = "commandhub"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "process",
    "time",
    "io-util",
    "sync"
] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.154"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

